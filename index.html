<!DOCTYPE html>

<html>
<head>

<meta charset="UTF-8">

<title>
AI Agent 團隊管理中心
</title>


<style>

body {

font-family: Arial, sans-serif;

background:#f5f5f5;

padding:30px;

}


h1 {

text-align:center;

}



.agent {

background:white;

width:250px;

padding:20px;

margin:20px;

border-radius:15px;

box-shadow:0 3px 10px #cccccc;

}


.status {

font-size:20px;

}



</style>


</head>


<body>


<h1>
🤖 AI Agent 團隊管理中心
</h1>



<div id="agent-list">

載入 AI Agent 中...

</div>

<script>

fetch("系統設定/AI代理資料.json")

.then(response => response.json())

.then(data => {


let agents = data.AI代理;


let html = "";


agents.forEach(agent => {


html += `

<div class="agent">

<h2>
🤖 ${agent.名稱}
</h2>


<p>
角色：

${agent.角色}

</p>


<p>

狀態：

${agent.狀態}

</p>


<p>

目前任務：

${agent.任務}

</p>


</div>


`;


});


document.getElementById("agent-list").innerHTML = html;


});


</script>

</body>

</html>
